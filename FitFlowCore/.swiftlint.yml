strict: true
disabled_rules:
  - trailing_comma
included:
  - Sources
  - Tests
excluded:
  - .build
  - .swiftpm
line_length:
  warning: 140
  error: 180
file_length:
  warning: 500
  error: 800
type_body_length:
  warning: 350
  error: 500
identifier_name:
  min_length: 2
  excluded:
    - id
    - x
    - y
